<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let a=10;
        let b=20;
        let c=a+b;
        console.log("Tông cộng của a và b là: ", c);
        console.log("Hiệu của a và b là: ", a-b);
        console.log("Tích của a và b là: ", a*b);
        console.log("Thương của a và b là: ", a/b);
        document.write(5+5 );
        let name ="Nguyen Van A";
        window.alert(name + " không đồng ý");
        let x =window.prompt("Nhâp tên: ", "Tên của bạn là gì?");
        window.alert("Xin chào " + x);

        //ktra kiểu dữ liệu
        console.log(typeof x); 
        //chuyển đổi kiểu dữ liệu

       // tính tổng 1 số bằng cách nhập 2 số (chuyển kiểu dữ liệu), hiển thị ra tổng
        let num1 = window.prompt("Nhập số thứ nhất: ", "Số thứ nhất");
        let num2 = window.prompt("Nhập số thứ hai: ", "Số thứ hai");
        let sum = Number(num1) + Number(num2);
        window.alert("Tổng của " + num1 + " và " + num2 + " là: " + sum);

        //Tính chỉ số BMI 
         let weight = window.prompt("Nhập cân nặng của bạn (kg): ", "Cân nặng");
        let height = window.prompt("Nhập chiều cao của bạn (m): ", "Chiều cao");
        let bmi = weight / (height * height);
        window.alert("Chỉ số BMI của bạn là: " + bmi);
    </script>
</body>
</html>
