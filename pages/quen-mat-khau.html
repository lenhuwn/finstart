<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | FinStart</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/public.css">
    <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<body data-layout="auth" data-root="../" data-page="forgot">

    <main class="auth-shell">
        <div class="auth-card">
            <a class="logo" href="../index.html"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#006C49"/><path d="M8 22.5l5.5-6 4 3.5L23 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="2.2" fill="#C9F9E7"/></svg><span>Fin<b>Start</b></span></a>
            <h1>Đặt lại mật khẩu</h1>
            <p class="auth-lead">Nhập email và họ tên đã đăng ký để đặt mật khẩu mới.</p>

            <div class="form-alert" id="formAlert" role="alert"></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email đã đăng ký</label>
                    <input class="input" type="email" id="email" name="email" placeholder="email@sinhvien.edu.vn">
                    <span class="field-error" data-for="email"></span>
                </div>
                <div class="form-group">
                    <label for="name">Họ và tên đã đăng ký</label>
                    <input class="input" id="name" name="name" placeholder="Nguyễn Văn An">
                    <span class="field-error" data-for="name"></span>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu mới</label>
                    <input class="input" type="password" id="password" name="password" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
                    <span class="field-error" data-for="password"></span>
                </div>
                <button class="btn btn-dark btn-lg btn-block mt-16" type="submit">Đặt lại mật khẩu</button>
            </form>
        </div>

        <a class="auth-back" href="dang-nhap.html">← Quay lại đăng nhập</a>
    </main>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
