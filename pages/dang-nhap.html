<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | FinStart</title>
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/public.css">
    <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<!-- Cổng ĐĂNG NHẬP + ĐĂNG KÝ (2 tab) + CHẾ ĐỘ KHÁCH.
     dang-ky.html tự chuyển về đây với tab Đăng ký. -->
<body data-layout="auth" data-root="../" data-page="login">

    <main class="auth-shell">
        <div class="auth-card">
            <!-- ========== 1. LOGO + TIÊU ĐỀ ========== -->
            <a class="logo" href="../index.html"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#006C49"/><path d="M8 22.5l5.5-6 4 3.5L23 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="2.2" fill="#C9F9E7"/></svg><span>Fin<b>Start</b></span></a>
            <h1 id="authTitle">Chào mừng trở lại</h1>
            <p class="auth-lead" id="authLead">Đăng nhập để vào bảng điều khiển tài chính của bạn.</p>

            <!-- ========== 2. CHẾ ĐỘ KHÁCH ========== -->
            <button class="btn btn-primary btn-lg btn-block" type="button" id="guestBtn">Dùng thử ngay – không cần tài khoản</button>
            <p class="guest-hint">Chế độ khách: dùng đủ mọi tính năng với dữ liệu mẫu, <b>không lưu</b> khi đóng tab.</p>

            <div class="divider">hoặc dùng tài khoản</div>

            <!-- ========== 3. TAB ========== -->
            <div class="auth-tabs" role="tablist" aria-label="Đăng nhập hoặc đăng ký">
                <button type="button" role="tab" id="tab-login" aria-controls="loginForm" aria-selected="true" class="active" data-tab="login">Đăng nhập</button>
                <button type="button" role="tab" id="tab-register" aria-controls="registerForm" aria-selected="false" data-tab="register">Đăng ký</button>
            </div>

            <div class="form-alert" id="formAlert" role="alert"></div>

            <!-- ========== 4A. ĐĂNG NHẬP ========== -->
            <form id="loginForm" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="email@sinhvien.edu.vn" autocomplete="email">
                    <span class="field-error" data-for="email"></span>
                </div>
                <div class="form-group">
                    <div class="label-row"><label for="password">Mật khẩu</label><a href="quen-mat-khau.html">Quên mật khẩu?</a></div>
                    <input class="input" type="password" id="password" name="password" placeholder="Mật khẩu" autocomplete="current-password">
                    <span class="field-error" data-for="password"></span>
                </div>
                <button class="btn btn-dark btn-lg btn-block mt-16" type="submit">Đăng nhập</button>
                <p class="demo-line">Tài khoản mẫu: <button type="button" class="link-btn" id="demoBtn">demo@finstart.vn / finstart123</button></p>
            </form>

            <!-- ========== 4B. ĐĂNG KÝ ========== -->
            <form id="registerForm" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input class="input" id="name" name="name" placeholder="Nguyễn Văn An" autocomplete="name">
                    <span class="field-error" data-for="name"></span>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input class="input" type="email" id="regEmail" name="email" placeholder="email@sinhvien.edu.vn" autocomplete="email">
                    <span class="field-error" data-for="email"></span>
                </div>
                <div class="form-group">
                    <label for="regPassword">Mật khẩu</label>
                    <input class="input" type="password" id="regPassword" name="password" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
                    <span class="field-error" data-for="password"></span>
                </div>
                <p class="plan-note" id="planNote" hidden></p>
                <button class="btn btn-dark btn-lg btn-block mt-16" type="submit">Tạo tài khoản</button>
                <p class="demo-line">Bằng việc đăng ký, bạn đồng ý với <a href="dieu-khoan-dich-vu.html">Điều khoản</a> và <a href="chinh-sach-bao-mat.html">Chính sách bảo mật</a>.</p>
            </form>
        </div>

        <a class="auth-back" href="../index.html">← Về trang chủ</a>
    </main>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
